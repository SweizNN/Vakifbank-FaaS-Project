# ============================================================
#  .github/workflows/deploy.yml
#  VakıfBank FaaS Platform — CI/CD Pipeline (GitHub Actions)
#
#  Target: DigitalOcean Droplet (k3s + Knative)
#  Namespace: faas-platform
#
#  Pipeline:
#  1. test       → Lint + syntax check backend/main.py
#  2. build-push → Build Docker image & push to Docker Hub
#  3. deploy     → SSH into droplet, update k8s deployment
# ============================================================

name: "VakıfBank FaaS Platform — CD Pipeline"

on:
  push:
    branches: ["main", "master"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "k8s/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      force_redeploy:
        description: "Force redeploy even without code changes"
        type: boolean
        default: false

env:
  REGISTRY: "docker.io"
  IMAGE_NAME: "faas-platform-api"

jobs:
  # ────────────────────────────────────────────────────────────────
  # Job 1: Test — Lint & syntax check
  # ────────────────────────────────────────────────────────────────
  test:
    name: "🧪 Test — FastAPI Backend"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: "📦 Install Dependencies"
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install flake8 pyflakes

      - name: "🔍 Lint Check (flake8)"
        working-directory: backend
        run: |
          # E9,F63,F7,F82 = critical errors (syntax, import errors, undefined names)
          # Lints the whole backend/ tree (routers/, services/, generators/
          # included) — not just main.py — so new modules are never silently
          # unchecked.
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: "🧪 Run pytest (Unit & Integration)"
        working-directory: backend
        run: |
          pytest tests/ -v --cov=.

      - name: "📝 Validate k8s Manifests (dry-run)"
        run: |
          # Install kubectl for manifest validation
          KUBECTL_VERSION=$(curl -sSL https://dl.k8s.io/release/stable.txt)
          curl -sSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

          # Use client-side dry-run to validate YAML structure
          kubectl apply --dry-run=client -f k8s/namespace.yaml || true
          kubectl apply --dry-run=client -f k8s/resource-quota.yaml || true
          kubectl apply --dry-run=client -f k8s/deployment.yaml || true
          kubectl apply --dry-run=client -f k8s/redis.yaml || true
          # tls.yaml uses cert-manager CRDs (ClusterIssuer) kubectl doesn't
          # ship a schema for client-side — this step is `|| true` anyway,
          # it's a syntax sanity check, not a cluster-aware validation.
          kubectl apply --dry-run=client -f k8s/tls.yaml || true
          echo "✅ k8s manifest validation complete"

  # ────────────────────────────────────────────────────────────────
  # Job 2: Build & Push Docker Image to Docker Hub
  # ────────────────────────────────────────────────────────────────
  build-push:
    name: "🐳 Build & Push — faas-platform-api"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.tag.outputs.short_sha }}
      full_image: ${{ steps.tag.outputs.full_image }}

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🏷️ Generate Image Tag"
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          DOCKER_USER="${{ secrets.DOCKER_HUB_USER }}"
          FULL_IMAGE="${DOCKER_USER}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}"
          echo "short_sha=${SHORT_SHA}"         >> $GITHUB_OUTPUT
          echo "full_image=${FULL_IMAGE}"        >> $GITHUB_OUTPUT
          echo "docker_user=${DOCKER_USER}"      >> $GITHUB_OUTPUT
          echo "Image will be tagged: ${FULL_IMAGE}"

      - name: "⚙️ Setup Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🔐 Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: "🏷️ Docker Metadata"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=VakıfBank FaaS Platform API
            org.opencontainers.image.description=FastAPI orchestrator for Knative function deployment
            org.opencontainers.image.vendor=VakıfBank

      - name: "🐳 Build & Push Docker Image"
        uses: docker/build-push-action@v5
        with:
          # Build context is the repo root so the Dockerfile can COPY
          # both backend/ and frontend/ directories
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: "📊 Build Summary"
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🐳 Docker Build Summary

          - **Image**: \`${{ secrets.DOCKER_HUB_USER }}/${{ env.IMAGE_NAME }}\`
          - **Tag**: \`sha-${SHORT_SHA}\`
          - **Full ref**: \`${{ steps.tag.outputs.full_image }}\`
          EOF

  # ────────────────────────────────────────────────────────────────
  # Job 3: Remote Deployment — SSH into DigitalOcean Droplet
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 Deploy — DigitalOcean Droplet (faas-platform)"
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name != 'pull_request'
    environment: production

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🏷️ Resolve Image Tag"
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: "🚀 SSH Remote Deployment"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: GITHUB_SHA,GITHUB_REPOSITORY
          timeout: 600s     # 10 min — allow for kubectl rollout
          script: |
            set -e
            SHORT_SHA="${GITHUB_SHA::7}"
            IMAGE_TAG="sha-${SHORT_SHA}"
            PROJECT_DIR="/root/Vakifbank-FaaS-Project"

            echo "========================================================"
            echo " 🚀 FAAS PLATFORM — DEPLOYING TO DIGITALOCEAN DROPLET"
            echo "    Image Tag: ${IMAGE_TAG}"
            echo "========================================================"

            # ── 0. Open Firewall Ports ─────────────────────────────────
            echo "🛡️ Configuring UFW firewall (if active)..."
            ufw allow 30081/tcp || true
            ufw allow 80/tcp || true
            ufw allow 443/tcp || true

            # ── 1. Ensure Minikube cluster is running ─────────────────
            if ! minikube status &>/dev/null; then
              echo "⚠️ Minikube is not running. Starting Minikube..."
              minikube start --driver=docker --force --cpus=4 --memory=4096
            else
              echo "✅ Minikube is running."
            fi

            # ── 2. Ensure Knative Serving & Kourier are configured ──────
            echo "📦 Ensuring Knative Serving + Kourier Ingress + DNS..."
            kubectl apply -f https://github.com/knative/serving/releases/download/knative-v1.14.0/serving-crds.yaml
            kubectl apply -f https://github.com/knative/serving/releases/download/knative-v1.14.0/serving-core.yaml
            kubectl apply -f https://github.com/knative/net-kourier/releases/download/knative-v1.14.0/kourier.yaml
            
            kubectl patch configmap/config-network -n knative-serving \
              --type merge --patch '{"data":{"ingress-class":"kourier.ingress.networking.knative.dev"}}'

            # Patch Kourier Service to use NodePort 31080 for HTTP so we can proxy it
            kubectl patch svc kourier -n kourier-system \
              --type merge -p '{"spec": {"type": "NodePort", "ports": [{"port": 80, "targetPort": 8080, "nodePort": 31080, "name": "http2"}]}}' || true

            # Manually configure Magic DNS since Minikube doesn't provide an External IP automatically
            DROPLET_IP="${{ secrets.DO_DROPLET_IP }}"
            kubectl patch configmap/config-domain -n knative-serving \
              --type merge --patch "{\"data\": {\"${DROPLET_IP}.sslip.io\": \"\"}}"

            # ── 2b. cert-manager (Let's Encrypt) ───────────────────────
            echo "🔐 Ensuring cert-manager is installed..."
            kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.15.3/cert-manager.yaml
            kubectl wait --for=condition=Available --timeout=180s deployment/cert-manager -n cert-manager
            kubectl wait --for=condition=Available --timeout=180s deployment/cert-manager-webhook -n cert-manager

            # ── 2c. ingress-nginx ────────────────────────────────────────
            # The single host-port-80/443 entrypoint from here on: it TLS-
            # terminates for the FaaS Platform UI/API and answers Let's
            # Encrypt's HTTP-01 challenges. Knative/Kourier traffic keeps
            # working unchanged behind it via the passthrough Ingress in
            # k8s/tls.yaml (kourier-system namespace) — see that file's
            # comments for why.
            echo "🌐 Ensuring ingress-nginx is installed..."
            kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.2/deploy/static/provider/cloud/deploy.yaml
            kubectl wait --for=condition=Available --timeout=180s deployment/ingress-nginx-controller -n ingress-nginx

            # Fixed NodePorts so the host-level proxy (step 8) has a stable target
            kubectl patch svc ingress-nginx-controller -n ingress-nginx \
              --type merge -p '{"spec": {"type": "NodePort", "ports": [{"name": "http", "port": 80, "targetPort": "http", "nodePort": 31380}, {"name": "https", "port": 443, "targetPort": "https", "nodePort": 31390}]}}'

            # Deployment "Available" can flip true a few seconds before the
            # ValidatingAdmissionWebhook it registers (validate.nginx.ingress.
            # kubernetes.io, served by this same controller pod) actually has
            # a routable endpoint — any `kubectl apply` of an Ingress in that
            # window fails with "dial tcp ...:443: connect: connection
            # refused" against the ingress-nginx-controller-admission Service.
            # Wait for the pod itself, then for that Service to have a real
            # endpoint, before anything tries to create an Ingress.
            echo "⏳ Waiting for ingress-nginx controller pod readiness..."
            kubectl wait --for=condition=Ready pod -n ingress-nginx -l app.kubernetes.io/component=controller --timeout=180s

            echo "⏳ Waiting for ingress-nginx admission webhook endpoint..."
            for i in $(seq 1 30); do
              EP=$(kubectl get endpoints ingress-nginx-controller-admission -n ingress-nginx -o jsonpath='{.subsets[0].addresses[0].ip}' 2>/dev/null || true)
              if [ -n "$EP" ]; then
                echo "✅ Admission webhook endpoint ready ($EP)."
                break
              fi
              echo "   still waiting... ($i/30)"
              sleep 5
            done

            # ── 3. Clone or update the repository ─────────────────────
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "📥 Cloning repository..."
              git clone "https://github.com/${GITHUB_REPOSITORY}.git" "$PROJECT_DIR"
              cd "$PROJECT_DIR"
            else
              echo "🔄 Updating repository..."
              cd "$PROJECT_DIR"
              git fetch origin
              git reset --hard "origin/$(git rev-parse --abbrev-ref HEAD)"
            fi

            # ── 0. Setup Namespaces, Quotas, Redis, TLS and Docker Credentials
            echo "🔐 Setting up Kubernetes Secrets for Docker Hub..."
            kubectl apply -f k8s/namespace.yaml

            echo "📏 Applying tenant-functions LimitRange..."
            kubectl apply -f k8s/resource-quota.yaml

            echo "🗄️  Applying Redis (shared deploy-job store)..."
            kubectl apply -f k8s/redis.yaml

            echo "🔏 Applying ClusterIssuers + Ingress (TLS)..."
            # Belt-and-suspenders on top of the endpoint wait above: kube-proxy
            # (iptables/ipvs) can take a few extra seconds to actually route
            # to a freshly-ready endpoint, so retry instead of failing the
            # whole deploy on one bad-timing webhook call.
            TLS_APPLIED=false
            for i in $(seq 1 6); do
              if kubectl apply -f k8s/tls.yaml; then
                TLS_APPLIED=true
                break
              fi
              echo "   ingress-nginx admission webhook not reachable yet, retrying in 10s... ($i/6)"
              sleep 10
            done
            if [ "$TLS_APPLIED" != "true" ]; then
              echo "❌ Failed to apply k8s/tls.yaml after retries."
              exit 1
            fi

            # Credentials for Orchestrator (to push)
            kubectl create secret docker-registry docker-hub-creds \
              --docker-server=https://index.docker.io/v1/ \
              --docker-username="${{ secrets.DOCKER_HUB_USERNAME }}" \
              --docker-password="${{ secrets.DOCKER_HUB_TOKEN }}" \
              --namespace=faas-platform \
              --dry-run=client -o yaml | kubectl apply -f -

            # Credentials for Tenant Functions (to pull)
            kubectl create secret docker-registry docker-hub-creds \
              --docker-server=https://index.docker.io/v1/ \
              --docker-username="${{ secrets.DOCKER_HUB_USERNAME }}" \
              --docker-password="${{ secrets.DOCKER_HUB_TOKEN }}" \
              --namespace=tenant-functions \
              --dry-run=client -o yaml | kubectl apply -f -

            # Patch the default ServiceAccount in tenant-functions to use the pull secret
            kubectl patch serviceaccount default \
              -n tenant-functions \
              -p '{"imagePullSecrets": [{"name": "docker-hub-creds"}]}'

            # Patch the ServiceAccount to use pull secret for the API image itself
            kubectl patch serviceaccount faas-orchestrator \
              -n faas-platform \
              -p '{"imagePullSecrets": [{"name": "docker-hub-creds"}]}' \
              --type=merge || true

            # ── 6. Deploy with the new image tag ──────────────────────
            echo "🐳 Applying deployment manifest with tag: ${IMAGE_TAG}..."
            DOCKER_HUB_USER="${{ secrets.DOCKER_HUB_USER }}"
            # Replace both the username prefix AND the :latest tag so the
            # manifest works correctly regardless of which Docker Hub account is used.
            sed -e "s|image: .*/faas-platform-api:.*|image: ${DOCKER_HUB_USER}/faas-platform-api:${IMAGE_TAG}|g" \
              k8s/deployment.yaml | kubectl apply -f -

            # ── 7. Verify Rollout Status ──────────────────────────────
            echo "⏳ Waiting for pod rollout..."
            kubectl rollout status deployment/faas-platform-api -n faas-platform --timeout=600s
            echo "✅ Deployment successful!"

            # ── 8. Setup Port-Forwarding (Robust Docker Socat Proxy) ──
            echo "🔌 Setting up Port-Forwarding for external access..."
            MINIKUBE_IP=$(minikube ip)
            # Proxy for FaaS Platform API — legacy plain-HTTP NodePort access,
            # kept working as-is alongside the new TLS entrypoint below.
            docker rm -f faas-api-proxy || true
            docker run -d --restart always --name faas-api-proxy --network host alpine/socat TCP-LISTEN:30081,fork,reuseaddr TCP:${MINIKUBE_IP}:30081

            # Proxy host port 80/443 → ingress-nginx, which is now the single
            # entrypoint for both the TLS'd FaaS Platform UI/API and (via the
            # passthrough Ingress in k8s/tls.yaml) plain-HTTP Knative function
            # traffic that used to be forwarded straight to Kourier.
            docker rm -f kourier-proxy || true  # old direct-to-Kourier proxy, superseded by ingress-http-proxy below
            docker rm -f ingress-http-proxy || true
            docker run -d --restart always --name ingress-http-proxy --network host alpine/socat TCP-LISTEN:80,fork,reuseaddr TCP:${MINIKUBE_IP}:31380

            docker rm -f ingress-https-proxy || true
            docker run -d --restart always --name ingress-https-proxy --network host alpine/socat TCP-LISTEN:443,fork,reuseaddr TCP:${MINIKUBE_IP}:31390

            # ── 9. Verify pods are running ─────────────────────────────
            echo ""
            echo "📊 Current pod status:"
            kubectl get pods -n faas-platform -o wide
            echo ""
            echo "========================================================"
            echo " ✅ DEPLOYMENT SUCCESSFUL!"
            DROPLET_IP="${{ secrets.DO_DROPLET_IP }}"
            echo " 🔐 FaaS Platform UI (TLS): https://${DROPLET_IP}.sslip.io"
            echo " 🌐 FaaS Platform UI:       http://${DROPLET_IP}:30081  (legacy, still up)"
            echo " 📡 Health Check:           http://${DROPLET_IP}:30081/health"
            echo " 📚 API Docs:               http://${DROPLET_IP}:30081/docs"
            echo "========================================================"

      - name: "📊 Deployment Summary"
        if: always()
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          STATUS="${{ job.status }}"
          ICON="✅"
          if [ "$STATUS" != "success" ]; then ICON="❌"; fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ${ICON} FaaS Platform Deployment — DigitalOcean Droplet

          | Field | Value |
          |-------|-------|
          | **Status** | ${STATUS} |
          | **Image Tag** | \`sha-${SHORT_SHA}\` |
          | **Droplet IP** | \`${{ secrets.DO_DROPLET_IP }}\` |
          | **Namespace** | \`faas-platform\` |

          ### 🌐 Access Points
          - **FaaS UI (TLS)**: https://${{ secrets.DO_DROPLET_IP }}.sslip.io — staging Let's Encrypt cert until flipped to prod in k8s/tls.yaml, see below
          - **FaaS UI (legacy)**: [http://${{ secrets.DO_DROPLET_IP }}:30081](http://${{ secrets.DO_DROPLET_IP }}:30081)
          - **API Docs**: [http://${{ secrets.DO_DROPLET_IP }}:30081/docs](http://${{ secrets.DO_DROPLET_IP }}:30081/docs)
          - **Health**: [http://${{ secrets.DO_DROPLET_IP }}:30081/health](http://${{ secrets.DO_DROPLET_IP }}:30081/health)

          Staging TLS certs aren't browser-trusted (expected warning). Once
          \`kubectl describe certificate faas-platform-tls -n faas-platform\`
          shows \`Ready=True\`, switch the \`cert-manager.io/cluster-issuer\`
          annotation on \`faas-platform-ingress\` (k8s/tls.yaml) to
          \`letsencrypt-prod\` and re-run this workflow.
          EOF
