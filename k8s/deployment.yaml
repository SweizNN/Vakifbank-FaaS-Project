# ============================================================
#  Vakifbank-FaaS-Project/k8s/deployment.yaml
#  FaaS Platform API — Deployment, Service, ConfigMap, Secret
#
#  Namespace: faas-platform
#  Exposes the FastAPI orchestrator on NodePort 30081
# ============================================================

# ── ConfigMap: Platform configuration ────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: faas-platform-config
  namespace: faas-platform
  labels:
    app: faas-platform-api
data:
  # Docker Hub registry prefix for function images.
  # Format: docker.io/<your-username>
  # All user function images will be pushed as:
  #   docker.io/<DOCKER_HUB_USER>/faas-fn-<function-name>
  # The "faas-fn-" prefix keeps them isolated from other project
  # images (e.g. sweizn/frontend, sweizn/fraud-alert) on Docker Hub.
  REGISTRY_PREFIX: "docker.io/sweizn"

  # Kubernetes namespace where user functions are deployed
  TENANT_NAMESPACE: "tenant-functions"

  # Deploy timeout in seconds (10 minutes for cold buildpack builds)
  DEPLOY_TIMEOUT_SECONDS: "600"

  # Workspace directory inside the container
  WORKSPACE_BASE: "/tmp/faas-workspace"

  # FastAPI log level
  LOG_LEVEL: "info"

---
# ── Secret: Docker Hub registry credentials ───────────────────────────────────
# This secret must be manually populated after first deploy, OR via CI/CD.
#
# To create this secret manually on the server:
#   kubectl create secret docker-registry docker-hub-creds \
#     --docker-server=https://index.docker.io/v1/ \
#     --docker-username=<DOCKER_HUB_USERNAME> \
#     --docker-password=<DOCKER_HUB_TOKEN> \
#     --docker-email=<your-email> \
#     -n faas-platform
#
# Then link it to the default ServiceAccount:
#   kubectl patch serviceaccount faas-orchestrator -n faas-platform \
#     -p '{"imagePullSecrets":[{"name":"docker-hub-creds"}]}'
#
# NOTE: The func CLI running inside the pod also needs this for `func deploy`.
# Mount it as a volume at /root/.docker/config.json (done below).
apiVersion: v1
kind: Secret
metadata:
  name: docker-hub-creds
  namespace: faas-platform
  labels:
    app: faas-platform-api
  annotations:
    # Populated by CI/CD — do not commit real values
    kubernetes.io/description: "Docker Hub credentials for func deploy image push"
type: kubernetes.io/dockerconfigjson
data:
  # Populated by CI/CD pipeline via kubectl create secret --dry-run=client -o yaml | kubectl apply -f -
  # Placeholder — base64-encoded empty config (replaced at deploy time)
  .dockerconfigjson: e30K

---
# ── Deployment: FastAPI FaaS Orchestrator ────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: faas-platform-api
  namespace: faas-platform
  labels:
    app: faas-platform-api
    version: "latest"
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: faas-platform-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: faas-platform-api
    spec:
      serviceAccountName: faas-orchestrator

      # Allow the container to access the Docker socket for buildpacks
      # (only needed if running docker-in-docker; with Buildpacks this
      #  is handled by the func CLI's embedded pack builder)
      volumes:
        - name: docker-config
          secret:
            secretName: docker-hub-creds
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: workspace
          emptyDir:
            medium: Memory  # Fast in-memory workspace for func scaffolding
            sizeLimit: "2Gi"

      initContainers:
        # Verify kubectl can reach the cluster before starting FastAPI
        - name: cluster-connectivity-check
          image: bitnami/kubectl:latest
          command: ["kubectl", "get", "namespace", "tenant-functions", "--request-timeout=10s"]
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"

      containers:
        - name: faas-platform-api
          # Image tag is replaced by CI/CD with sha-XXXXXXX
          image: sweizn/faas-platform-api:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # NOTE: No resource limits as per project spec (server has plenty of capacity)
          # Only requests for scheduling purposes
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

          env:
            - name: REGISTRY_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: faas-platform-config
                  key: REGISTRY_PREFIX
            - name: TENANT_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: faas-platform-config
                  key: TENANT_NAMESPACE
            - name: DEPLOY_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: faas-platform-config
                  key: DEPLOY_TIMEOUT_SECONDS
            - name: WORKSPACE_BASE
              valueFrom:
                configMapKeyRef:
                  name: faas-platform-config
                  key: WORKSPACE_BASE
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: faas-platform-config
                  key: LOG_LEVEL
            # Expose pod identity for logging
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          volumeMounts:
            # Docker Hub credentials for func deploy image push
            - name: docker-config
              mountPath: /root/.docker
              readOnly: true
            # Isolated workspace for func CLI operations
            - name: workspace
              mountPath: /tmp/faas-workspace

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 8
            failureThreshold: 2

          lifecycle:
            preStop:
              exec:
                # Graceful shutdown — allow in-flight deploys to finish (up to 60s)
                command: ["/bin/sh", "-c", "sleep 10"]

      terminationGracePeriodSeconds: 70

---
# ── Service: Expose FastAPI on NodePort 30081 ────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: faas-platform-service
  namespace: faas-platform
  labels:
    app: faas-platform-api
spec:
  type: NodePort
  selector:
    app: faas-platform-api
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30081
