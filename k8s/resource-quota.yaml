# ============================================================
#  Vakifbank-FaaS-Project/k8s/resource-quota.yaml
#  LimitRange for tenant-functions
#
#  The ResourceQuota in namespace.yaml caps the *namespace total*
#  (how much CPU/memory all tenant functions may consume together).
#  It says nothing about any *individual* container — without a
#  LimitRange, a single deploy with no requests/limits (which is
#  every deploy today; services/pipeline.py never sets them) can
#  freely burst to 100% of whatever is left in the quota, starving
#  every other function on the 4 vCPU / 8 GB droplet.
#
#  This file adds that per-container guardrail:
#    - default / defaultRequest → applied automatically to any container
#      that doesn't specify its own value for that resource.
#    - min / max               → hard floor/ceiling on whatever value a
#      container *does* end up with, whether that came from `default`/
#      `defaultRequest` above or was set explicitly.
#
#  min.cpu MUST stay <= Knative's own revision-cpu-request default (25m,
#  from the config-defaults ConfigMap in knative-serving — see
#  https://knative.dev/docs/serving/configuration/deployment/). Knative's
#  revision controller sets that request on every user-container itself,
#  unconditionally, regardless of what `func deploy` sends — it's not
#  something a LimitRange default fills in. Set min.cpu above it (e.g. the
#  50m this file originally shipped with) and the API server rejects the
#  pod outright ("minimum cpu usage per Container is 50m, but request is
#  25m") — every single deploy fails FailedCreate/RevisionMissing, exactly
#  as bare metal as it sounds. Learned this the hard way in production.
# ============================================================

apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-functions-limits
  namespace: tenant-functions
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      min:
        cpu: "10m"
        memory: "64Mi"
      max:
        cpu: "2"
        memory: "2Gi"
